        <rect x="-106" y="-86" width="12" height="12" fill="#FFFFFF" stroke="#C2410C" stroke-width="2" />
        <circle cx="100" cy="20" r="8" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2" />
